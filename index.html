<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email RAG Search</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: #2c3e50;
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }
        
        .header p {
            opacity: 0.8;
            font-size: 16px;
        }
        
        .chat-container {
            padding: 30px;
        }
        
        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .input-group input {
            flex: 1;
            padding: 15px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #3498db;
        }
        
        .btn {
            padding: 15px 25px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .btn:hover {
            background: #2980b9;
        }
        
        .btn-secondary {
            background: #95a5a6;
        }
        
        .btn-secondary:hover {
            background: #7f8c8d;
        }
        
        .response-area {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            min-height: 200px;
            border: 1px solid #e1e8ed;
        }
        
        .loading {
            text-align: center;
            color: #7f8c8d;
            font-style: italic;
        }
        
        .response-content {
            line-height: 1.6;
            white-space: pre-wrap;
        }
        
        .sources {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e1e8ed;
        }
        
        .source-item {
            background: white;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            border-left: 4px solid #3498db;
        }
        
        .source-subject {
            font-weight: bold;
            color: #2c3e50;
        }
        
        .source-from {
            color: #7f8c8d;
            font-size: 14px;
        }
        
        .error {
            color: #e74c3c;
            background: #fdf2f2;
            padding: 12px;
            border-radius: 6px;
            border-left: 4px solid #e74c3c;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📧 Email RAG Search</h1>
            <p>Ask questions about your 38,000+ emails</p>
        </div>
        
        <div class="chat-container">
            <div class="input-group">
                <input type="text" id="queryInput" placeholder="Ask about your emails... (e.g., 'What paid surveys do I have?')" />
                <button class="btn" onclick="sendMessage()">Send</button>
            </div>
            
            <div class="input-group">
                <button class="btn btn-secondary" onclick="analyzeProfile()">Analyze My Profile</button>
                <button class="btn btn-secondary" onclick="clearChat()">Clear</button>
            </div>
            
            <div id="responseArea" class="response-area">
                <div class="loading" id="loading" style="display: none;">
                    Searching through 38,000 emails...
                </div>
                <div id="responseContent" class="response-content"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3001/api';
        
        async function sendMessage() {
            const input = document.getElementById('queryInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            showLoading();
            clearResponse();
            
            try {
                const response = await fetch(`${API_BASE}/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    displayResponse(data.response, data.sources);
                } else {
                    displayError(data.error);
                }
            } catch (error) {
                displayError('Failed to connect to server. Make sure it\'s running on port 3001.');
            } finally {
                hideLoading();
                input.value = '';
            }
        }
        
        async function analyzeProfile() {
            showLoading();
            clearResponse();
            
            try {
                const response = await fetch(`${API_BASE}/analyze-profile`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    displayResponse(data.analysis, data.emailExamples);
                } else {
                    displayError(data.error);
                }
            } catch (error) {
                displayError('Failed to connect to server. Make sure it\'s running on port 3001.');
            } finally {
                hideLoading();
            }
        }
        
        function displayResponse(response, sources = []) {
            const content = document.getElementById('responseContent');
            content.innerHTML = `<div class="response-text">${formatResponse(response)}</div>`;
            
            if (sources && sources.length > 0) {
                const sourcesHTML = `
                    <div class="sources">
                        <h3>📋 Sources (${sources.length} emails):</h3>
                        ${sources.map(source => `
                            <div class="source-item">
                                <div class="source-subject">${source.subject || 'No subject'}</div>
                                <div class="source-from">From: ${source.from || 'Unknown'}</div>
                                ${source.similarity ? `<div class="source-similarity">Relevance: ${(source.similarity * 100).toFixed(1)}%</div>` : ''}
                            </div>
                        `).join('')}
                    </div>
                `;
                content.innerHTML += sourcesHTML;
            }
        }
        
        function formatResponse(text) {
            // Convert line breaks and basic formatting
            return text
                .replace(/\n/g, '<br>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>');
        }
        
        function displayError(error) {
            const content = document.getElementById('responseContent');
            content.innerHTML = `<div class="error">❌ ${error}</div>`;
        }
        
        function showLoading() {
            document.getElementById('loading').style.display = 'block';
        }
        
        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }
        
        function clearResponse() {
            document.getElementById('responseContent').innerHTML = '';
        }
        
        function clearChat() {
            clearResponse();
            document.getElementById('queryInput').value = '';
        }
        
        // Allow pressing Enter to send
        document.getElementById('queryInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
        
        // Display welcome message
        displayResponse(`Welcome! You can:
• Ask specific questions about your emails (e.g., "What paid surveys do I have?")
• Get personal insights (e.g., "What are my main interests?")
• Click "Analyze My Profile" for a comprehensive analysis

I'll search through your 38,000+ emails to find relevant information.`);
    </script>
</body>
</html>
